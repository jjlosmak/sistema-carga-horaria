<!-- IMPRESSAO COMPACTA ATE 25 PROFESSORES -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink:#172735;
      --paper:#f5f3ee;
      --card:#fff;
      --soft:#faf9f6;
      --line:#dedacf;
      --slate:#5b6b74;
      --gold:#1006CC;
      --gold-dark:#0B0499;
      --gold-soft:#ECEBFF;
      --green:#3e7657;
      --green-soft:#e9f3ed;
      --red:#b5533c;
      --red-soft:#fbecea;
      --nav:#172735;
      --shadow:0 10px 30px rgba(20,35,47,.07);
    }

    body[data-theme="dark"] {
      --ink:#edf2f4;
      --paper:#11191f;
      --card:#1a252d;
      --soft:#202c35;
      --line:#34434c;
      --slate:#b1bec5;
      --gold-soft:#202448;
      --green:#7fc49b;
      --green-soft:#20372a;
      --red:#e58b77;
      --red-soft:#402823;
      --nav:#0c1318;
      --shadow:0 10px 30px rgba(0,0,0,.22);
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      color:var(--ink);
      background:var(--paper);
      font-family:Inter,sans-serif;
    }

    button,input,select { font:inherit; }
    button { cursor:pointer; }
    h1,h2,h3,.number { font-family:Lora,serif; }

    .wrap {
      max-width:1180px;
      margin:auto;
      padding:24px 24px 70px;
    }

    .top {
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:14px;
      padding:14px 0 24px;
      margin-bottom:22px;
      border-bottom:1px solid var(--line);
    }

    .system-name {
      font-family:Lora,serif;
      font-size:18px;
      font-weight:600;
    }

    .system-name small {
      display:block;
      margin-top:5px;
      font:12px Inter,sans-serif;
      color:var(--slate);
    }

    .logo-area { text-align:center; }
    .logo { max-width:210px; max-height:60px; }
    .logo-dark { display:none; }
    body[data-theme="dark"] .logo-light { display:none; }
    body[data-theme="dark"] .logo-dark { display:inline-block; }

    .logo-fallback {
      font-size:17px;
      letter-spacing:3px;
      font-weight:600;
    }

    .logo-fallback small {
      display:block;
      margin-top:5px;
      font-size:9px;
      letter-spacing:1px;
      color:var(--gold);
    }

    .top-actions {
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .user-email {
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:12px;
      color:var(--slate);
    }

    .theme-button {
      width:38px;
      height:38px;
      flex-shrink:0;
      border:1px solid var(--line);
      border-radius:50%;
      color:var(--ink);
      background:var(--card);
    }

    .fields,.actions {
      display:flex;
      flex-wrap:wrap;
      align-items:flex-end;
      gap:12px;
      margin-bottom:14px;
    }

    .field {
      display:flex;
      flex-direction:column;
      gap:6px;
      flex:0 1 180px;
      color:var(--slate);
      font-size:12px;
    }

    .field.grow { flex:1 1 260px; }

    input,select {
      width:100%;
      min-height:40px;
      padding:9px 11px;
      border:1px solid var(--line);
      border-radius:6px;
      background:var(--card);
      color:var(--ink);
    }

    input:focus,select:focus {
      outline:2px solid var(--gold);
      outline-offset:1px;
    }

    input[readonly],select:disabled {
      background:var(--soft);
      color:var(--slate);
    }

    .button {
      min-height:40px;
      padding:9px 16px;
      border:1px solid var(--gold-dark);
      border-radius:6px;
      background:var(--gold);
      color:#fff;
      font-weight:600;
    }

    .button:hover { background:var(--gold-dark); }
    .button:disabled { opacity:.55; cursor:not-allowed; }

    .button.ghost {
      background:transparent;
      color:var(--ink);
      border-color:var(--line);
    }

    .button.danger {
      color:var(--red);
      background:var(--red-soft);
      border-color:var(--red);
    }

    .button.small {
      min-height:30px;
      padding:5px 9px;
      font-size:11px;
    }

    .nav {
      display:flex;
      flex-wrap:wrap;
      gap:5px;
      padding:6px;
      margin:20px 0 28px;
      border-radius:8px;
      background:var(--nav);
    }

    .nav-button,.nav details summary {
      border:0;
      border-radius:5px;
      padding:10px 14px;
      background:transparent;
      color:#ffffffc9;
      font-size:13px;
      cursor:pointer;
      list-style:none;
    }

    .nav-button.active,.nav-button:hover,
    .nav details.active summary {
      background:#ffffff20;
      color:#fff;
    }

    .nav details { position:relative; }
    .nav summary::-webkit-details-marker { display:none; }

    .dropdown {
      position:absolute;
      top:calc(100% + 8px);
      left:0;
      z-index:20;
      min-width:240px;
      padding:7px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--card);
      box-shadow:var(--shadow);
    }

    .dropdown button {
      display:block;
      width:100%;
      border:0;
      padding:11px;
      text-align:left;
      background:transparent;
      color:var(--ink);
      border-radius:5px;
    }

    .dropdown button:hover {
      background:var(--gold-dark);
      color:white;
    }

    .page-title { margin:0 0 5px; font-size:20px; }
    .sub,.hint { color:var(--slate); font-size:12px; line-height:1.6; }
    .sub { margin:0 0 20px; }
    .hint { margin:10px 0 14px; }

    .box,.ficha {
      padding:22px;
      margin-bottom:26px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--card);
      box-shadow:var(--shadow);
    }

    .flash {
      display:none;
      padding:11px 13px;
      margin:12px 0;
      border-radius:6px;
      font-size:13px;
    }

    .flash.ok {
      display:block;
      background:var(--green-soft);
      color:var(--green);
    }

    .flash.err {
      display:block;
      background:var(--red-soft);
      color:var(--red);
    }

    .kpis {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-bottom:30px;
    }

    .kpi {
      padding:17px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--card);
    }

    .kpi .label {
      min-height:30px;
      color:var(--slate);
      font-size:12px;
      margin-bottom:9px;
    }

    .number { font-size:23px; }
    .positive { color:var(--green); }
    .negative { color:var(--red); }

    section { margin-bottom:32px; }
    section h2 { font-size:16px; margin:0 0 14px; }

    .table-wrap {
      overflow:auto;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--card);
    }

    table { width:100%; border-collapse:collapse; font-size:12px; }

    th,td {
      padding:11px 12px;
      border-bottom:1px solid var(--line);
      text-align:left;
      vertical-align:middle;
    }

    th { color:var(--slate); background:var(--soft); white-space:nowrap; }
    tr:last-child td { border-bottom:0; }
    .right { text-align:right; }
    .nowrap { white-space:nowrap; }

    .badge {
      display:inline-block;
      padding:3px 7px;
      border-radius:12px;
      background:var(--gold-soft);
      font-size:11px;
    }

    .badge.red { color:var(--red); background:var(--red-soft); }
    .badge.green { color:var(--green); background:var(--green-soft); }

    .bar-row {
      display:grid;
      grid-template-columns:minmax(170px,260px) 1fr 85px;
      align-items:center;
      gap:14px;
      border-bottom:1px solid var(--line);
      padding:10px 0;
      font-size:12px;
    }

    .bar-track { height:14px; background:var(--soft); border-radius:4px; }
    .bar-fill { height:100%; border-radius:4px; background:var(--gold); }

    .empty {
      padding:24px;
      border:1px dashed var(--line);
      border-radius:8px;
      color:var(--slate);
      font-size:13px;
    }

    .hidden { display:none !important; }

    .dynamic {
      padding:16px;
      margin:12px 0;
      background:var(--soft);
      border:1px solid var(--line);
      border-radius:7px;
    }

    .calculation {
      background:var(--gold-soft);
      padding:12px;
      margin:14px 0;
      border-radius:6px;
      font-size:13px;
    }

    .ficha-title { font-size:21px; margin:0 0 6px; }

    .ficha-professor {
      display:inline-block;
      background:var(--gold-dark);
      color:white;
      padding:9px 14px;
      border-radius:5px;
      margin:12px 0;
      font-weight:600;
    }

    .ficha-section {
      margin-top:20px;
      padding:10px 13px;
      background:var(--nav);
      color:white;
      font-size:13px;
      font-weight:600;
    }

    .ficha-row {
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:11px 13px;
      border:1px solid var(--line);
      border-top:0;
      font-size:13px;
    }

    .print-only { display:none; }

    .print-preview {
      padding-top:24px;
      border-top:1px dashed var(--line);
    }

    .print-note { font-size:11px; color:var(--slate); line-height:1.5; }

    .anonymous .bar-row {
      grid-template-columns:90px 1fr 80px;
      break-inside:avoid;
    }

    .loading { padding:90px 20px; text-align:center; color:var(--slate); }

    .spinner {
      width:28px; height:28px; margin:0 auto 16px;
      border:3px solid var(--line);
      border-top-color:var(--gold);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }

    @keyframes spin { to { transform:rotate(360deg); } }

    dialog {
      width:min(560px,94vw);
      max-height:90vh;
      overflow:auto;
      padding:24px;
      color:var(--ink);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:10px;
      box-shadow:var(--shadow);
    }

    dialog::backdrop { background:#0009; }
    dialog h2 { margin-top:0; font-size:19px; }

    @media(max-width:760px) {
      .wrap { padding:15px 14px 50px; }
      .system-name,.user-email { display:none; }
      .top { grid-template-columns:1fr auto 1fr; }
      .logo-area { grid-column:2; }
      .top-actions { grid-column:3; }
      .logo-fallback { font-size:14px; letter-spacing:1px; }
      .logo { max-width:165px; }
      .kpis { grid-template-columns:repeat(2,1fr); }
      .bar-row { grid-template-columns:135px 1fr 70px; }
    }

    @media(max-width:480px) {
      .field { flex:1 1 100%; }
      .kpis { grid-template-columns:1fr; }
      .nav { gap:2px; }
      .nav-button,.nav details summary { padding:9px; font-size:12px; }
      .dropdown { left:auto; right:0; }
      .bar-row { grid-template-columns:1fr 65px; }
      .bar-row .bar-track { grid-column:1 / -1; grid-row:2; }
      .anonymous .bar-row { grid-template-columns:70px 1fr 70px; }
      .anonymous .bar-track { grid-column:auto; grid-row:auto; }
    }

    /* Fichas de 18 a 25 professores: compacta��o tamb�m na pr�via. */
    .ficha-print.ficha-compact { padding:8px; }
    .ficha-compact .ficha-title { font-size:18px; line-height:1.2; margin:0 0 4px; }
    .ficha-compact .print-note { font-size:10px; line-height:1.25; margin:6px 0; }
    .ficha-compact .ficha-professor { font-size:13px; line-height:1.25; padding:6px 10px; margin:7px 0; }
    .ficha-compact .ficha-section { font-size:11px; line-height:1.25; padding:6px 10px; margin-top:10px; }
    .ficha-compact .ficha-row { font-size:11px; line-height:1.25; padding:6px 10px; }
    .ficha-compact .anonymous .bar-row { font-size:10px; line-height:1.2; padding:4px 0; gap:10px; }
    .ficha-compact .bar-track,.ficha-compact .bar-fill { height:10px; }
    .ficha-compact .badge { font-size:9px; line-height:1.1; padding:2px 5px; }
    @page ficha-documento { size:A4 portrait; margin:12mm; }

    @media print {
      body,body[data-theme="dark"] {
        --ink:#172735;
        --paper:#fff;
        --card:#fff;
        --soft:#edeae1;
        --line:#dedacf;
        --slate:#5b6b74;
        --gold:#b8863b;
        --gold-dark:#8c6527;
        --gold-soft:#f6ecdb;
        --nav:#172735;
        color:#172735;
        background:white;
      }

      .no-print,.screen-ficha,.print-preview,dialog {
        display:none !important;
      }

      .print-only { display:block !important; }
      .report-print table { width:100%; border-collapse:collapse; font-size:11px; }
      .report-print th,.report-print td { border:1px solid #aaa; padding:6px; text-align:left; }
      .report-print thead { display:table-header-group; }
      .report-print tr { break-inside:avoid; }
      .wrap { max-width:none; padding:0; }
      .ficha { border:0; box-shadow:none; padding:12px; }
      .ficha-row,.bar-row { break-inside:avoid; }
      .ficha-batch-item { page:ficha-documento; }
      .ficha-print.ficha-compact { break-inside:avoid; page-break-inside:avoid; padding:8px; }
      .ficha-batch-item + .ficha-batch-item { break-before:page; page-break-before:always; }

      .anonymous .bar-row {
        grid-template-columns:90px 1fr 80px;
      }

      .anonymous .bar-track {
        grid-column:auto;
        grid-row:auto;
      }

      .ficha-section,.ficha-professor,.bar-fill,.badge {
        print-color-adjust:exact;
        -webkit-print-color-adjust:exact;
      }
    }
    .university-logo {
  width: clamp(160px, 25vw, 280px);
  margin: 0 auto;
  color: #1006CC;
}

.university-logo svg {
  display: block;
  width: 100%;
  height: auto;
}

.university-logo svg path {
  fill: currentColor !important;
}

body[data-theme="dark"] .university-logo {
  color: #FFFFFF;
}

<body>
  <div id="app">
    <div class="loading"><div class="spinner"></div>Carregando.</div>
  </div>

  <dialog id="professor-dialog"></dialog>
  <dialog id="remove-dialog"></dialog>
  <dialog id="edit-dialog"></dialog>

  <script>
    // Espa�o reservado para as logos oficiais.
    const LOGO_LIGHT = '';
    const LOGO_DARK = '';

    const TIMES = {
      'Manh�': { start:'08:00', end:'11:00' },
      'Tarde': { start:'14:00', end:'17:00' },
      'Noite': { start:'19:00', end:'22:00' }
    };

    const state = {
      info:null,
      professors:[],
      records:[],
      reasons:[],
      coordinators:[],
      view:'painel',
      semester:null,
      turno:null,
      titularId:null,
      launchDate:"",
      reportMode:"semana",
      reportDate:(() => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); })(),
      fichaId:null,
      fichaPrintMode:"atual",
      fichaPrintIds:[],
      fichaPrintContext:null,
      showPrintPreview:false,
      toast:null
    };

    const $ = id => document.getElementById(id);

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    // Arredonda apenas a apresenta��o, usando as horas originais.
    function fmt(value) {
      const hoursValue = Number(value || 0);
      if (!Number.isFinite(hoursValue)) return '-';
      const minutes = Math.round(Math.abs(hoursValue) * 60);
      const sign = hoursValue < 0 && minutes > 0 ? '-' : '';
      return sign + Math.floor(minutes / 60) + 'h' +
        String(minutes % 60).padStart(2,'0') + 'min';
    }

    function sum(rows,key) {
      return rows.reduce((total,row) => total + Number(row[key] || 0),0);
    }

    function hours(start,end) {
      if (!start || !end) return 0;

      const minutes = value => {
        const parts = value.split(':').map(Number);
        return parts[0] * 60 + parts[1];
      };

      return Math.max(0,minutes(end)-minutes(start))/60;
    }

    function dateLabel(value) {
      const parts = String(value || '').split('-');

      return parts.length === 3
        ? parts[2]+'/'+parts[1]+'/'+parts[0]
        : '-';
    }

    function professor(id) {
      return state.professors.find(p => p.id === id) || null;
    }

    function isActive(p) {
      return p && p.active !== false;
    }

    function historyName(id) {
      const p = professor(id);

      if (!p) return '(cadastro n�o encontrado)';

      return p.name + (
        !isActive(p)
          ? ' ('+(p.departureReason || 'Desligado')+')'
          : ''
      );
    }

    function linked(id) {
      return state.records.some(r =>
        r.responsibleId === id ||
        r.titularId === id ||
        r.substituteId === id
      );
    }

    function semesters() {
      return [...new Set(state.professors.map(p => p.semester).filter(Boolean))]
        .sort((a,b) =>
          (parseInt(a,10)||0)-(parseInt(b,10)||0) ||
          a.localeCompare(b)
        );
    }

    function turns() {
      const available = state.professors
        .filter(p => p.semester === state.semester)
        .map(p => p.turno);

      return Object.keys(TIMES).filter(t => available.includes(t));
    }

    function ensureContext() {
      const sems = semesters();

      if (!sems.includes(state.semester)) {
        state.semester = sems.length ? sems[sems.length-1] : null;
      }

      const available = turns();

      if (!available.includes(state.turno)) {
        state.turno = available[0] || null;
      }
    }

    function contextProfessors(type,onlyActive) {
      return state.professors.filter(p =>
        p.semester === state.semester &&
        p.turno === state.turno &&
        (!type || p.type === type) &&
        (!onlyActive || isActive(p))
      );
    }

    function contextRecords() {
      // Inclui desligados para n�o perder os totais hist�ricos.
      const ids = new Set(
        contextProfessors('Titular',false).map(p => p.id)
      );

      return state.records.filter(r => ids.has(r.titularId));
    }

    function applyData(data) {
      state.professors = data.professors || [];
      state.records = data.records || [];
      state.reasons = data.reasons || [];
      state.coordinators = data.coordinators || state.coordinators || [];
      ensureContext();
    }

    function flash(id,type,message) {
      if (!$(id)) return;
      $(id).className = 'flash no-print '+type;
      $(id).textContent = message;
    }

    function rpc(name,args) {
      return new Promise((resolve,reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[name](...(args || []));
      });
    }

    function errorMessage(error) {
      return error && error.message
        ? error.message
        : 'N�o foi poss�vel concluir a opera��o.';
    }

    function notify(message) {
      state.toast = message;
      render();
    }

    function setTheme(theme) {
      document.body.dataset.theme = theme;

      try {
        localStorage.setItem('carga-horaria-theme',theme);
      } catch (e) {}

      if ($('theme')) {
        $('theme').textContent = theme === 'dark' ? '?' : '?';
      }
    }

    function initialTheme() {
      try {
        const saved = localStorage.getItem('carga-horaria-theme');
        if (saved === 'light' || saved === 'dark') return saved;
      } catch (e) {}

      return window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light';
    }

    function logoHtml() {
    const svg = '<strong>Unichristus</strong>';

      return '<div class="university-logo">' + svg + '</div>';
    }

    function option(value,label,selected) {
      return `<option value="${esc(value)}"
        ${value === selected ? 'selected' : ''}>${esc(label)}</option>`;
    }

    function shell(content) {
      const registrations = ['titulares','substitutos','motivos','coordenadores'];

      return `<div class="wrap">
        <header class="top no-print">
          <div class="system-name">
            Carga Hor�ria<small>Painel da coordena��o</small>
          </div>

          <div class="logo-area">${logoHtml()}</div>

          <div class="top-actions">
            <span class="user-email">${esc(state.info.email)}</span>
            <button class="theme-button" id="theme"
              title="Alternar tema" aria-label="Alternar tema">
              ${document.body.dataset.theme === 'dark' ? '?' : '?'}
            </button>
          </div>
        </header>

        <div class="fields no-print">
          <label class="field">Semestre
            <select id="semester">
              ${semesters().map(s => option(s,s,state.semester)).join('')}
            </select>
          </label>

          <label class="field">Turno
            <select id="turno">
              ${turns().map(t => option(t,t,state.turno)).join('')}
            </select>
          </label>
        </div>

        <nav class="nav no-print">
          ${[
            ['painel','Painel'],
            ['lancar','Lan�ar horas'],
            ['relatorios','Relat�rios'],
            ['ficha','Ficha individual']
          ].map(([id,label]) => `
            <button data-view="${id}"
              class="nav-button ${state.view === id ? 'active' : ''}">
              ${label}
            </button>`).join('')}

          <details class="${registrations.includes(state.view) ? 'active' : ''}">
            <summary>Cadastros ?</summary>
            <div class="dropdown">
              <button data-view="titulares">Professores titulares</button>
              <button data-view="substitutos">Professores substitutos</button>
              <button data-view="motivos">Motivos de aus�ncia</button>
              <button data-view="coordenadores">Coordenadores</button>
            </div>
          </details>
        </nav>

        <div class="flash no-print" id="global-flash"></div>
        ${content}
      </div>`;
    }

    function render() {
      ensureContext();

      const views = {
        painel:painelHtml,
        lancar:lancarHtml,
        relatorios:relatoriosHtml,
        ficha:fichaHtml,
        titulares:() => cadastroHtml('Titular'),
        substitutos:() => cadastroHtml('Substituto'),
        motivos:motivosHtml,
        coordenadores:coordenadoresHtml
      };

      $('app').innerHTML = shell(views[state.view]());

      document.querySelectorAll('[data-view]').forEach(button => {
        button.onclick = () => {
          state.view = button.dataset.view;
          render();
        };
      });

      $('semester').onchange = event => {
        state.semester = event.target.value;
        state.turno = null;
        state.titularId = null;
        state.fichaId = null;
        state.showPrintPreview = false;
        render();
      };

      $('turno').onchange = event => {
        state.turno = event.target.value;
        state.titularId = null;
        state.fichaId = null;
        state.showPrintPreview = false;
        render();
      };

      $('theme').onclick = () => setTheme(
        document.body.dataset.theme === 'dark' ? 'light' : 'dark'
      );

      if (state.view === 'lancar') attachLancar();
      if (state.view === 'ficha') attachFicha();
      if (state.view === 'relatorios') attachRelatorios();
      if (state.view === 'motivos') attachMotivos();
      if (state.view === 'coordenadores') attachCoordenadores();

      if (state.view === 'titulares' || state.view === 'substitutos') {
        attachCadastro();
      }

      if (state.toast) {
        flash('global-flash','ok',state.toast);
        state.toast = null;
      }
    }

    function titularStats() {
      const records = contextRecords();

      return contextProfessors('Titular',false).map(p => {
        const direct = records.filter(r =>
          r.titularId === p.id && !r.absent
        );

        const absences = records.filter(r =>
          r.titularId === p.id && r.absent
        ).length;

        const total = sum(direct,'hours');
        const planned = sum(direct,'plannedHours');

        return {
          id:p.id,
          name:historyName(p.id),
          classes:direct.length,
          absences:absences,
          hours:total,
          planned:planned,
          saldo:total-planned,
          average:direct.length ? total/direct.length : 0
        };
      });
    }

    function ranking() {
      return titularStats().sort((a,b) =>
        b.average-a.average ||
        b.hours-a.hours ||
        a.name.localeCompare(b.name)
      );
    }

    function substituteStats() {
      const map = {};

      contextRecords().filter(r => r.absent && r.substituteId)
        .forEach(r => {
          if (!map[r.substituteId]) {
            map[r.substituteId] = {
              id:r.substituteId,
              name:historyName(r.substituteId),
              count:0,
              hours:0
            };
          }

          map[r.substituteId].count++;
          map[r.substituteId].hours += r.hours;
        });

      return Object.values(map).sort((a,b) =>
        b.hours-a.hours || a.name.localeCompare(b.name)
      );
    }

    function table(headers,rows) {
      return `<div class="table-wrap"><table>
        <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows || `<tr><td colspan="${headers.length}">
          Nenhum registro encontrado.
        </td></tr>`}</tbody>
      </table></div>`;
    }

    function substituteTable() {
      return table(
        ['Professor substituto','Substitui��es','Horas dadas'],
        substituteStats().map(p => `<tr>
          <td>${esc(p.name)}</td>
          <td>${p.count}</td>
          <td>${fmt(p.hours)}</td>
        </tr>`).join('')
      );
    }

    function kpi(label,value) {
      return `<div class="kpi">
        <div class="label">${label}</div>
        <div class="number">${value}</div>
      </div>`;
    }

    function painelHtml() {
      const records = contextRecords();
      const titulars = contextProfessors('Titular',false);
      const plannedClasses = sum(titulars,'plannedClasses');
      const titularHours = sum(records.filter(r => !r.absent),'hours');
      const substituteHours = sum(records.filter(r => r.absent),'hours');
      const total = titularHours+substituteHours;
      const planned = sum(records,'plannedHours');
      const saldo = total-planned;
      const stats = titularStats().sort((a,b) => b.hours-a.hours);
      const max = Math.max(...stats.map(p => p.hours),0.1);

      return `<h1 class="page-title">Painel geral</h1>
        <p class="sub">
          ${esc(state.semester || '-')} � ${esc(state.turno || '-')}.
          Os registros dos professores desligados continuam nos totais hist�ricos.
        </p>

        <div class="kpis">
          ${kpi('Aulas previstas no semestre',plannedClasses)}
          ${kpi('Aulas realizadas',records.length)}
          ${kpi('Progresso do semestre',
            (plannedClasses ? Math.round(records.length/plannedClasses*100) : 0)+'%')}
          ${kpi('Horas dadas por titulares',fmt(titularHours))}
          ${kpi('Horas dadas por substitutos',fmt(substituteHours))}
          ${kpi('Total geral de horas',fmt(total))}
          ${kpi('Horas previstas das aulas realizadas',fmt(planned))}
          ${kpi('Saldo geral',
            `<span class="${saldo >= 0 ? 'positive' : 'negative'}">
              ${saldo >= 0 ? '+' : ''}${fmt(saldo)}
            </span>`)}
        </div>

        <section>
          <h2>Horas dos professores titulares</h2>
          ${stats.length ? stats.map(p => `<div class="bar-row">
            <div>${esc(p.name)}</div>
            <div class="bar-track"><div class="bar-fill"
              style="width:${p.hours/max*100}%"></div></div>
            <div class="right">${fmt(p.hours)}</div>
          </div>`).join('') : '<div class="empty">Nenhum titular cadastrado.</div>'}
        </section>

        <section>
          <h2>Professores substitutos</h2>
          ${substituteTable()}
        </section>`;
    }

    function launchProfessors(type) {
      const name = p => p.name.replace(/^dra?\.?\s*/i,'').trim();
      return contextProfessors(type,true).slice().sort((a,b) =>
        name(a).localeCompare(name(b),'pt-BR',{sensitivity:'base'}) || a.id.localeCompare(b.id));
    }

    function lancarHtml() {
      const titulars = launchProfessors('Titular');
      const substitutes = launchProfessors('Substituto');

      if (!titulars.some(p => p.id === state.titularId)) {
        state.titularId = titulars.length ? titulars[0].id : null;
      }

      if (!titulars.length) {
        return `<h1 class="page-title">Lan�ar horas</h1>
          <div class="empty">
            Nenhum titular ativo neste semestre e turno.
          </div>`;
      }

      const p = professor(state.titularId);

      return `<h1 class="page-title">Lan�ar horas</h1>
        <p class="sub">
          Em caso de falta, as horas ser�o atribu�das ao substituto.
          Professores desligados n�o aparecem nas sele��es.
        </p>

        <form id="launch-form" class="box">
          <div class="fields">

    function attachLancar() {
      if (!$('launch-form')) return;

      function preview() {
        const real = hours($('real-start').value,$('real-end').value);
        const planned = hours($('planned-start').value,$('planned-end').value);
        const who = $('launch-absent').value === 'Sim' ? 'substituto' : 'titular';

        if (!$('real-start').value || !$('real-end').value) {
          $('calculation').textContent = 'Preencha os hor�rios reais para ver o c�lculo.';
        } else if (!real) {
          $('calculation').textContent = 'O fim real precisa ser depois do in�cio.';
        } else {
          $('calculation').textContent =
            'Previsto: '+fmt(planned)+' � Horas do '+who+': '+
            fmt(real)+' � Saldo: '+fmt(real-planned);
        }
      }

      let lastAbsent = false;

      function absenceChanged(clear) {
        const absent = $('launch-absent').value === 'Sim';
        lastAbsent = absent;

        $('meeting-hint').classList.toggle('hidden',$('launch-absent').value !== 'Reuni�o');
        $('substitution-fields').classList.toggle('hidden',!absent);
        $('launch-substitute').required = absent;
        $('launch-substitute').disabled = !absent;
        $('launch-reason').required = absent;
        $('launch-reason').disabled = !absent;

        $('real-start-label').textContent =
          'In�cio real do '+(absent ? 'substituto' : 'titular');

        $('real-end-label').textContent =
          'Fim real do '+(absent ? 'substituto' : 'titular');

        if (clear) {
          // Evita atribuir ao titular hor�rios digitados para o substituto.
          $('real-start').value = '';
          $('real-end').value = '';
          $('launch-substitute').value = '';
          $('launch-reason').value = '';
          $('other-reason').value = '';
        }

        reasonChanged();
        preview();
      }

      function reasonChanged() {
        const other = $('launch-absent').value === 'Sim' &&
          $('launch-reason').value === '__outro__';

        $('other-field').classList.toggle('hidden',!other);
        $('other-reason').required = other;
        $('other-reason').disabled = !other;

        if (!other) $('other-reason').value = '';
      }

      $('launch-titular').onchange = event => {
        state.titularId = event.target.value;
        const p = professor(state.titularId);
        $('planned-start').value = p ? p.defaultStart : '';
        $('planned-end').value = p ? p.defaultEnd : '';
        preview();
      };

      $('launch-search').oninput = event => {
        const norm = text => text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
        const query = norm(event.target.value.trim());
        const selected = $('launch-titular').value;
        const list = launchProfessors('Titular').filter(p => norm(p.name).includes(query));
        const keep = list.some(p => p.id === selected) ? selected : '';
        $('launch-titular').innerHTML = option('',list.length ? 'Selecione o professor' : 'Nenhum professor encontrado','') +
          list.map(p => option(p.id,p.name,keep)).join('');
        $('launch-titular').value = keep;
        $('launch-titular').dispatchEvent(new Event('change'));
      };

      $('launch-date').onchange = event => { state.launchDate = event.target.value; };

      // S� limpa os hor�rios ao entrar/sair de "Faltou" (hor�rio do substituto);
      // alternar entre Presente e Reuni�o mant�m o que j� foi digitado.
      $('launch-absent').onchange = () =>
        absenceChanged(($('launch-absent').value === 'Sim') !== lastAbsent);
      $('launch-reason').onchange = reasonChanged;
      $('real-start').oninput = preview;
      $('real-end').oninput = preview;
      absenceChanged(false);

      $('launch-form').onsubmit = async event => {
        event.preventDefault();

        const button = $('launch-save');
        const absent = $('launch-absent').value === 'Sim';

        const reason = absent
          ? ($('launch-reason').value === '__outro__'
              ? $('other-reason').value.trim()
              : $('launch-reason').value)
          : '';

        const args = [
          $('launch-titular').value,
          $('launch-date').value,
          absent ? 'Sim' : 'N�o',
          absent ? $('launch-substitute').value : '',
          reason,
          $('real-start').value,
          $('real-end').value,
          $('launch-absent').value === 'Reuni�o' ? 'Sim' : 'N�o'
        ];

        button.disabled = true;

        try {
          let record = await rpc('addRecord',args);
          let replaced = false;
          while (record.needsOverwrite) {
            const name = professor(args[0]).name;
            const accepted = window.confirm(
              'J� existe um lan�amento para '+name+' em '+dateLabel(args[1])+'.\n'+
              'Hor�rio real salvo: '+record.realStart+'-'+record.realEnd+'.\n\n'+
              'ATEN��O: ao confirmar, os hor�rios, a informa��o de falta, o substituto e o motivo ser�o REESCRITOS pelos dados deste formul�rio.\n'+
              'Esta a��o substitui o lan�amento anterior. Deseja sobrescrever?');
            if (!accepted) return;
            record = await rpc('addRecord',args.concat(record.token));
            replaced = true;
          }
          state.records = state.records.filter(r =>
            !(r.titularId === args[0] && r.date === args[1]));
          state.records.push(record);
          state.launchDate = args[1];
          const list = launchProfessors('Titular');
          const index = list.findIndex(p => p.id === args[0]);
          const next = list[index + 1];
          state.titularId = next ? next.id : args[0];
          notify((replaced ? 'Lan�amento sobrescrito.' : 'Lan�amento registrado.') +
            (next ? ' Pr�ximo professor: '+next.name+'.' : ' Voc� chegou ao final da lista.'));
          if ($('real-start')) $('real-start').focus();
        } catch (error) {
          flash('launch-flash','err',errorMessage(error));
        } finally {
          button.disabled = false;
        }
      };
    }

    function reportRange() {
      const value = /^\d{4}-\d{2}-\d{2}$/.test(state.reportDate)
        ? state.reportDate : new Date().toISOString().slice(0,10);
      const d = new Date(value+'T12:00:00Z');
      let start = new Date(d), end = new Date(d);
      if (state.reportMode === 'semana') {
        start.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));
        end = new Date(start); end.setUTCDate(start.getUTCDate()+6);
      } else if (state.reportMode === 'mes') {
        start = new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1,12));
        end = new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0,12));
      } else {
        const month = d.getUTCMonth() < 6 ? 0 : 6;
        start = new Date(Date.UTC(d.getUTCFullYear(),month,1,12));
        end = new Date(Date.UTC(d.getUTCFullYear(),month+6,0,12));
      }
      return { start:start.toISOString().slice(0,10), end:end.toISOString().slice(0,10) };
    }
